<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rastro</title>
		<meta name="description" content="Rastreamento de localização pessoal" />
		<link rel="icon" type="image/svg+xml" href="/icon.svg" />
		<link rel="apple-touch-icon" href="/icon.svg" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#14161c" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Rastro" />
		<script>
			(() => {
				const preference = /(?:^|;\s*)theme=(\w+)/.exec(document.cookie)?.[1];
				if (preference === 'light' || preference === 'dark') {
					document.documentElement.dataset.theme = `plinth-${preference}`;
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
